<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="amethyst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9d5ff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b21a8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crystal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <polygon points="50,10 65,35 60,70 40,70 35,35" fill="url(#amethyst)" stroke="#4c1d95" stroke-width="1.5"/>
    <polygon points="50,10 65,35 50,40 35,35" fill="#d8b4fe" opacity="0.7"/>
    <polygon points="25,45 38,55 35,80 20,80 15,60" fill="url(#crystal2)" stroke="#4c1d95" stroke-width="1.5"/>
    <polygon points="75,50 85,60 82,85 68,82 65,60" fill="url(#crystal2)" stroke="#4c1d95" stroke-width="1.5"/>
    <polygon points="25,45 38,55 30,60 20,55" fill="#d8b4fe" opacity="0.6"/>
    <polygon points="75,50 85,60 78,65 70,60" fill="#d8b4fe" opacity="0.6"/>
    <line x1="50" y1="15" x2="52" y2="35" stroke="#f3e8ff" stroke-width="1" opacity="0.8"/>
    <line x1="27" y1="50" x2="30" y2="65" stroke="#f3e8ff" stroke-width="1" opacity="0.8"/>
    <line x1="77" y1="55" x2="79" y2="70" stroke="#f3e8ff" stroke-width="1" opacity="0.8"/>
  </g>
</svg>
